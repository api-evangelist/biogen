summary: >-
  Biogen runs a Mashery/Boomi API gateway estate: developer.biogen.com fronts api.biogen.com in
  production, developer1.biogen.com fronts dev1.api.biogen.com in non-production. Every
  cross-cutting convention below is REST-over-HTTPS with header API-key auth. Biogen publishes no
  written conventions guide, no idempotency mechanism, no pagination contract and no rate-limit
  header specification anywhere a machine can read, so most fields below are honest nulls rather
  than assertions.
auth:
  style: api-key
  parameter: x-api-key
  location: header
  transport: >-
    HTTPS only. The portal documentation states the API "strictly uses HTTPS in the transport layer".
  oauth2: >-
    Not declared by any anonymously readable Biogen API definition. The Mashery io-docs page renders
    an OAuth 2.0 flow selector for every portal, but the one readable Biogen definition declares
    data-auth-type="key", so no OAuth2 claim is made here.
  cross_ref: authentication/biogen-authentication.yml
idempotency:
  coverage: none
  supported: false
