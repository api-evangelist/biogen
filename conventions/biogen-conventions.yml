    that can be read anonymously. The one provider-published definition exposes two GET operations
    and no mutating surface at all, so there is nothing to replay-protect on the readable contract.
    Recorded as `none` rather than `na` because the estate as a whole (Worker Profile, Synapse Action
    Centre — both documented as accepting POST, both behind the portal login) does have write
    operations with no published replay protection.
