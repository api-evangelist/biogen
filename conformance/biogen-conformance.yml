  a service/package export catalogue), not a clinical data exchange, so the absence is a correct
  reading of the market Biogen's published APIs actually serve — recorded, not penalised, and NOT
  invented to fill the slot. No Compliance pointer is wired: no certification page (SOC 2, ISO 27001,
  HITRUST, HIPAA attestation) is published on any anonymously readable Biogen surface.
